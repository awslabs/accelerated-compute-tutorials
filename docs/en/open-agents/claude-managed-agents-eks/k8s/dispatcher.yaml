# The dispatcher: one small long-lived pod that long-polls the Anthropic work
# queue and binds a warm worker per session. Runs no untrusted code, so it does
# NOT need gVisor — it schedules on general-purpose nodes. Holds the environment
# key (to poll + stop work items); the org API key never reaches it.
#
# Replace ACCOUNT_ID / region in the image URI, and ENV_ID with your env_... value.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-agent-dispatcher
  namespace: claude-agents
  labels:
    app: claude-agent-dispatcher
spec:
  replicas: 1                      # a single poller is sufficient; it is not a bottleneck
  selector:
    matchLabels:
      app: claude-agent-dispatcher
  template:
    metadata:
      labels:
        app: claude-agent-dispatcher
    spec:
      serviceAccountName: claude-agent-dispatcher
      nodeSelector:
        kubernetes.io/arch: arm64   # Graviton general-purpose nodes
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: dispatcher
          image: ACCOUNT_ID.dkr.ecr.us-west-2.amazonaws.com/claude-agent-dispatcher:latest
          env:
            - name: ANTHROPIC_ENVIRONMENT_ID
              value: "ENV_ID"        # your env_... value
            - name: ANTHROPIC_ENVIRONMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-env-key
                  key: ANTHROPIC_ENVIRONMENT_KEY
            - name: SANDBOX_NAMESPACE
              value: "claude-agents"
            - name: SANDBOX_TEMPLATE
              value: "claude-agent-worker"
            - name: SANDBOX_WARMPOOL
              value: "claude-agent-worker"
            - name: SANDBOX_API_VERSION
              value: "v1beta1"        # matches Agent Sandbox controller v1.0.x; use v1alpha1 for v0.4.x/v0.5.x
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
