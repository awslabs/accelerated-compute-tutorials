# SPDX-License-Identifier: MIT-0
#
# Inference RayService — serves an LLM with Ray Serve + vLLM.
#
# Ray Serve LLM exposes an OpenAI-compatible endpoint on the Ray head's :8000.
# The model is served with a 2D parallel layout across the 16 H100 GPUs:
#   tensor_parallel_size=8  -> shard each layer across the 8 GPUs WITHIN a node
#                              (the per-layer all-reduce stays on fast NVLink)
#   pipeline_parallel_size=2 -> split the model's layers into 2 stages, one per
#                              node; only pipeline-stage ACTIVATIONS cross the
#                              node boundary (point-to-point), which is the
#                              traffic that runs over NCCL/EFA.
# TP*PP = 8*2 = 16 GPUs = both p5.48xlarge nodes.
#
# Why TP=8 + PP=2 instead of TP=16? Cross-node TP would run the chatty per-layer
# all-reduce over the network on every layer. Keeping TP=8 intra-node (NVLink)
# and using PP=2 for the cross-node hop moves far less data over EFA and gives
# better throughput — the standard multi-node LLM serving layout. The cross-node
# PP link still exercises EFA (see the NET/OFI logs), just more efficiently.
#
# Qwen3-32B fits this layout: 64 attention heads (TP must divide 64 -> 8 ok) and
# 64 transformer layers (PP must divide the layer count -> 2 ok, 32 layers/stage).
# An H100 has 80GB; Qwen3-32B in bf16 (~65GB) does not comfortably fit on one GPU
# with KV cache, so the multi-GPU layout is genuinely warranted.
#
# NOTE: multi-node (PP=2 across nodes) still uses vLLM's Ray distributed backend
# — RayService manages the RayCluster. Deploy EITHER this RayService OR the
# standalone ray-cluster-efa.yaml + finetune-rayjob.yaml — not both at once
# (they would double-book the GPUs).

apiVersion: ray.io/v1
kind: RayService
metadata:
  name: llm-inference
spec:
  serveConfigV2: |
    applications:
      - name: llm
        route_prefix: /
        import_path: ray.serve.llm:build_openai_app
        # vLLM and a matching Ray are baked into the custom image
        # (ray-efa:2.58.0-efa-vllm), so NO runtime_env pip install is needed.
        # This avoids the "Changing the ray version is not allowed" error that
        # occurs when a runtime_env pulls a vLLM whose ray dep differs from the
        # cluster's Ray version.
        args:
          llm_configs:
            - model_loading_config:
                model_id: Qwen/Qwen3-32B
                model_source: Qwen/Qwen3-32B
              engine_kwargs:
                tensor_parallel_size: 8        # intra-node shard (8 GPUs / node, over NVLink)
                pipeline_parallel_size: 2      # cross-node pipeline stages (activations over EFA)
                max_model_len: 32768
                dtype: bfloat16
                gpu_memory_utilization: 0.90
              deployment_config:
                autoscaling_config:
                  min_replicas: 1
                  max_replicas: 1

  rayClusterConfig:
    rayVersion: "2.58.0"

    headGroupSpec:
      rayStartParams:
        num-gpus: "0"
        dashboard-host: "0.0.0.0"
      template:
        spec:
          # Head on Auto Mode's built-in general-purpose (CPU) NodePool.
          nodeSelector:
            karpenter.sh/nodepool: general-purpose
          containers:
            - name: ray-head
              image: 361185619080.dkr.ecr.us-east-2.amazonaws.com/ray-efa:2.58.0-efa-vllm
              ports:
                - containerPort: 6379
                  name: gcs
                - containerPort: 8265
                  name: dashboard
                - containerPort: 10001
                  name: client
                - containerPort: 8000
                  name: serve
              resources:
                requests:
                  cpu: "3"
                  memory: 12Gi
                limits:
                  cpu: "3"
                  memory: 12Gi

    workerGroupSpecs:
      - groupName: gpu-efa-workers
        replicas: 2
        minReplicas: 2
        maxReplicas: 2
        rayStartParams:
          num-gpus: "8"
        template:
          spec:
            nodeSelector:
              karpenter.sh/nodepool: gpu-efa
            tolerations:
              - key: ray.io/node-type
                operator: Equal
                value: "worker"
                effect: NoSchedule
              - key: nvidia.com/gpu
                operator: Exists
                effect: NoSchedule
            containers:
              - name: ray-worker
                image: 361185619080.dkr.ecr.us-east-2.amazonaws.com/ray-efa:2.58.0-efa-vllm
                env:
                  - name: FI_PROVIDER
                    value: "efa"
                  - name: NCCL_DEBUG
                    value: "INFO"
                  - name: NCCL_PROTO
                    value: "simple"
                  - name: FI_EFA_USE_DEVICE_RDMA
                    value: "1"
                  - name: NCCL_NET_PLUGIN
                    value: "/opt/amazon/ofi-nccl/lib/libnccl-net.so"
                  - name: NCCL_TUNER_PLUGIN
                    value: "/opt/amazon/ofi-nccl/lib/libnccl-ofi-tuner.so"
                  - name: LD_LIBRARY_PATH
                    value: "/opt/amazon/efa/lib:/opt/amazon/ofi-nccl/lib:/opt/amazon/ofi-nccl/lib/x86_64-linux-gnu:$(LD_LIBRARY_PATH)"
                resources:
                  requests:
                    cpu: "180"
                    memory: 1800Gi
                    nvidia.com/gpu: "8"
                    vpc.amazonaws.com/efa: "8"
                    hugepages-2Mi: 5120Mi
                  limits:
                    cpu: "180"
                    memory: 1800Gi
                    nvidia.com/gpu: "8"
                    vpc.amazonaws.com/efa: "8"
                    hugepages-2Mi: 5120Mi
                volumeMounts:
                  - name: dshm
                    mountPath: /dev/shm
            volumes:
              - name: dshm
                emptyDir:
                  medium: Memory
                  sizeLimit: 16Gi
