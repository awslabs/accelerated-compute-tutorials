# SandboxTemplate: the pod the warm pool keeps ready. Hardened for untrusted,
# model-generated code — gVisor runtime, non-root, read-only root fs, dropped
# capabilities, and NO service-account token (so the agent's bash tool has no
# in-cluster API credentials). The only Anthropic credential is the environment key.
#
# Replace ACCOUNT_ID and the region in the image URI with your ECR repo.
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: claude-agent-worker
  namespace: claude-agents
spec:
  podTemplate:
    metadata:
      labels:
        app: claude-agent-worker
        isolation: gvisor
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: worker
          # The worker image: a :8080 listener that execs `ant beta:worker run`
          # once the dispatcher posts the session binding.
          image: ACCOUNT_ID.dkr.ecr.us-west-2.amazonaws.com/claude-agent-worker:latest
          ports:
            - name: dispatch
              containerPort: 8080
          env:
            # The per-environment service key — the only Anthropic credential here.
            - name: ANTHROPIC_ENVIRONMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-env-key
                  key: ANTHROPIC_ENVIRONMENT_KEY
            - name: DISPATCH_PORT
              value: "8080"
            - name: ANT_MAX_IDLE
              value: "60s"
            - name: OUTPUTS_MOUNT
              value: "/mnt/outputs"
            - name: SESSION_OUTPUTS
              value: "/mnt/session/outputs"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              memory: "2Gi"
          volumeMounts:
            - name: workspace          # writable scratch (root fs is read-only)
              mountPath: /workspace
            - name: session            # /mnt/session/outputs symlink target parent
              mountPath: /mnt/session
            - name: tmp
              mountPath: /tmp
            - name: outputs            # persistent per-session deliverables
              mountPath: /mnt/outputs
            - name: memory             # Anthropic memory stores working copy
              mountPath: /mnt/memory
      volumes:
        - name: workspace
          emptyDir: {}
        - name: session
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: memory
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: outputs
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3-encrypted
        resources:
          requests:
            storage: 10Gi
