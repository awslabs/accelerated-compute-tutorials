# Encrypted gp3 StorageClass for session-output volumes. Requires the EBS CSI
# driver (an EKS add-on). WaitForFirstConsumer so the volume lands in the same AZ
# as the pod that claims it.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-encrypted
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
