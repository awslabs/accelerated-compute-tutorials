# SPDX-License-Identifier: MIT-0
#
# NVIDIA DCGM Exporter on EKS Auto Mode GPU nodes.
#
# Auto Mode already provides the driver and device plugin, so the standalone
# dcgm-exporter chart is enough (no GPU Operator). The DaemonSet has 0 pods
# until the g6e.xlarge nodes join. It maps GPUs to pods through the kubelet
# pod-resources socket, so each GPU series carries the worker pod's name.

serviceMonitor:
  enabled: true
  interval: 15s
  # Must not exceed the interval. The chart defaults to 25s (for its 30s
  # interval); left at 25s, the Prometheus Operator rejects this
  # ServiceMonitor and no DCGM metric is ever scraped.
  scrapeTimeout: 10s

nodeSelector:
  eks.amazonaws.com/instance-gpu-manufacturer: nvidia

tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 500m, memory: 1Gi }

# Default set + the profiling (DCP) fields that separate prefill from decode:
# prefill is tensor-core bound (PIPE_TENSOR_ACTIVE high), decode is memory
# bound (DRAM_ACTIVE high). L40S has no NVLink, so NVLink fields are omitted.
customMetrics: |
  # Clocks
  DCGM_FI_DEV_SM_CLOCK,  gauge, SM clock frequency (in MHz).
  DCGM_FI_DEV_MEM_CLOCK, gauge, Memory clock frequency (in MHz).
  # Temperature / power
  DCGM_FI_DEV_GPU_TEMP,    gauge, GPU temperature (in C).
  DCGM_FI_DEV_MEMORY_TEMP, gauge, Memory temperature (in C).
  DCGM_FI_DEV_POWER_USAGE, gauge, Power draw (in W).
  DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, Total energy consumption since boot (in mJ).
  # Utilization
  DCGM_FI_DEV_GPU_UTIL,      gauge, GPU utilization (in %).
  DCGM_FI_DEV_MEM_COPY_UTIL, gauge, Memory utilization (in %).
  # Memory
  DCGM_FI_DEV_FB_FREE, gauge, Framebuffer memory free (in MiB).
  DCGM_FI_DEV_FB_USED, gauge, Framebuffer memory used (in MiB).
  # PCIe
  DCGM_FI_PROF_PCIE_TX_BYTES, counter, Bytes transmitted through PCIe TX.
  DCGM_FI_PROF_PCIE_RX_BYTES, counter, Bytes received through PCIe RX.
  # Errors / throttling
  DCGM_FI_DEV_XID_ERRORS,           gauge,   Value of the last XID error encountered.
  DCGM_FI_DEV_POWER_VIOLATION,      counter, Throttling duration due to power constraints (in us).
  DCGM_FI_DEV_THERMAL_VIOLATION,    counter, Throttling duration due to thermal constraints (in us).
  DCGM_FI_DEV_PCIE_REPLAY_COUNTER,  counter, Total number of PCIe retries.
  # Profiling (DCP)
  DCGM_FI_PROF_GR_ENGINE_ACTIVE,   gauge, Ratio of time the graphics engine is active.
  DCGM_FI_PROF_SM_ACTIVE,          gauge, Ratio of cycles an SM has at least 1 warp assigned.
  DCGM_FI_PROF_SM_OCCUPANCY,       gauge, Ratio of warps resident on an SM.
  DCGM_FI_PROF_PIPE_TENSOR_ACTIVE, gauge, Ratio of cycles the tensor (HMMA) pipe is active.
  DCGM_FI_PROF_DRAM_ACTIVE,        gauge, Ratio of cycles the device memory interface is active.
