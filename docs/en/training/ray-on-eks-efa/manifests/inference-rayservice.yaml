# SPDX-License-Identifier: MIT-0
#
# Inference RayService — serves an LLM with Ray Serve + vLLM.
#
# Ray Serve LLM exposes an OpenAI-compatible endpoint on the Ray head's :8000.
# The model is served with tensor parallelism across GPUs. With
# tensor_parallel_size=16 the model is sharded across all 16 H100 GPUs spanning
# BOTH p5.48xlarge nodes, so vLLM's cross-node tensor-parallel all-reduce
# runs over NCCL/EFA (configured in ray-cluster-efa.yaml).
#
# An H100 has 80GB; Qwen3-32B in bf16 (~65GB) does NOT comfortably fit on one
# GPU with KV cache, so tensor parallelism is genuinely warranted here. TP=16
# shards it across BOTH nodes, so the per-layer, per-token tensor-parallel
# all-reduce runs over NCCL/EFA. Reduce tensor_parallel_size to 8 to keep the
# model on a single node (NVLink only, no cross-node traffic) for comparison.
# (Qwen3-32B has 64 attention heads, so TP must divide 64: 8 or 16 both work.)
#
# NOTE: RayService manages its own RayCluster from the embedded rayClusterConfig.
# Deploy EITHER this RayService OR the standalone ray-cluster-efa.yaml +
# finetune-rayjob.yaml — not both at once (they would double-book the GPUs).

apiVersion: ray.io/v1
kind: RayService
metadata:
  name: llm-inference
spec:
  serveConfigV2: |
    applications:
      - name: llm
        route_prefix: /
        import_path: ray.serve.llm:build_openai_app
        # vLLM and a matching Ray are baked into the custom image
        # (ray-efa:2.58.0-efa-vllm), so NO runtime_env pip install is needed.
        # This avoids the "Changing the ray version is not allowed" error that
        # occurs when a runtime_env pulls a vLLM whose ray dep differs from the
        # cluster's Ray version.
        args:
          llm_configs:
            - model_loading_config:
                model_id: Qwen/Qwen3-32B
                model_source: Qwen/Qwen3-32B
              engine_kwargs:
                tensor_parallel_size: 16       # shard across all 16 H100 GPUs (2 nodes)
                max_model_len: 32768           # ~4GB weights/GPU at TP=16 leaves room for a large KV cache
                dtype: bfloat16
                gpu_memory_utilization: 0.90
              deployment_config:
                autoscaling_config:
                  min_replicas: 1
                  max_replicas: 1

  rayClusterConfig:
    rayVersion: "2.58.0"

    headGroupSpec:
      rayStartParams:
        num-gpus: "0"
        dashboard-host: "0.0.0.0"
      template:
        spec:
          # Head on Auto Mode's built-in general-purpose (CPU) NodePool.
          nodeSelector:
            karpenter.sh/nodepool: general-purpose
          containers:
            - name: ray-head
              image: 361185619080.dkr.ecr.us-east-2.amazonaws.com/ray-efa:2.58.0-efa-vllm
              ports:
                - containerPort: 6379
                  name: gcs
                - containerPort: 8265
                  name: dashboard
                - containerPort: 10001
                  name: client
                - containerPort: 8000
                  name: serve
              resources:
                requests:
                  cpu: "3"
                  memory: 12Gi
                limits:
                  cpu: "3"
                  memory: 12Gi

    workerGroupSpecs:
      - groupName: gpu-efa-workers
        replicas: 2
        minReplicas: 2
        maxReplicas: 2
        rayStartParams:
          num-gpus: "8"
        template:
          spec:
            nodeSelector:
              karpenter.sh/nodepool: gpu-efa
            tolerations:
              - key: ray.io/node-type
                operator: Equal
                value: "worker"
                effect: NoSchedule
              - key: nvidia.com/gpu
                operator: Exists
                effect: NoSchedule
            containers:
              - name: ray-worker
                image: 361185619080.dkr.ecr.us-east-2.amazonaws.com/ray-efa:2.58.0-efa-vllm
                env:
                  - name: FI_PROVIDER
                    value: "efa"
                  - name: NCCL_DEBUG
                    value: "INFO"
                  - name: NCCL_PROTO
                    value: "simple"
                  - name: FI_EFA_USE_DEVICE_RDMA
                    value: "1"
                  - name: NCCL_NET_PLUGIN
                    value: "/opt/amazon/ofi-nccl/lib/libnccl-net.so"
                  - name: NCCL_TUNER_PLUGIN
                    value: "/opt/amazon/ofi-nccl/lib/libnccl-ofi-tuner.so"
                  - name: LD_LIBRARY_PATH
                    value: "/opt/amazon/efa/lib:/opt/amazon/ofi-nccl/lib:/opt/amazon/ofi-nccl/lib/x86_64-linux-gnu:$(LD_LIBRARY_PATH)"
                resources:
                  requests:
                    cpu: "180"
                    memory: 1800Gi
                    nvidia.com/gpu: "8"
                    vpc.amazonaws.com/efa: "8"
                    hugepages-2Mi: 5120Mi
                  limits:
                    cpu: "180"
                    memory: 1800Gi
                    nvidia.com/gpu: "8"
                    vpc.amazonaws.com/efa: "8"
                    hugepages-2Mi: 5120Mi
                volumeMounts:
                  - name: dshm
                    mountPath: /dev/shm
            volumes:
              - name: dshm
                emptyDir:
                  medium: Memory
                  sizeLimit: 16Gi
