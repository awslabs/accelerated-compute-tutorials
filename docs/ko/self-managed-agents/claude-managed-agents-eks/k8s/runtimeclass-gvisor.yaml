# gVisor RuntimeClass. The handler `runsc` must be installed on the node (the
# gvisor Karpenter NodePool user-data does this at boot). Scheduling pins gVisor
# pods to nodes labeled runtime=gvisor and tolerates the matching taint.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
scheduling:
  nodeSelector:
    runtime: gvisor
  tolerations:
    - key: runtime
      value: gvisor
      effect: NoSchedule
