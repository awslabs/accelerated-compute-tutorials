# The per-environment service key (sk-ant-oat01-...). This is the ONLY Anthropic
# credential that ever reaches a sandbox pod; it can acknowledge work and post tool
# results for one environment and nothing else. The org API key (sk-ant-api03-...)
# must NOT go here.
#
# Create it from the CLI instead of committing a value (preferred):
#   kubectl -n claude-agents create secret generic anthropic-env-key \
#     --from-literal=ANTHROPIC_ENVIRONMENT_KEY="sk-ant-oat01-..."
#
# For production, source it from AWS Secrets Manager via the Secrets Store CSI
# driver or External Secrets Operator rather than a plain Secret. Rotate on any
# suspected exposure — revocation is validated on the worker's next call.
apiVersion: v1
kind: Secret
metadata:
  name: anthropic-env-key
  namespace: claude-agents
type: Opaque
stringData:
  ANTHROPIC_ENVIRONMENT_KEY: "REPLACE_WITH_sk-ant-oat01-KEY"
