# Plain ServiceAccount for the EKS Pod Identity path.
#
# With EKS Pod Identity there is NO `eks.amazonaws.com/role-arn` annotation — the
# role↔SA mapping is created out-of-band with:
#   aws eks create-pod-identity-association \
#     --cluster-name <cluster> --namespace agents \
#     --service-account agentcore-harness-agent-sa \
#     --role-arn arn:aws:iam::ACCOUNT_ID:role/agentcore-harness-agent-role
#
# Module 4 already creates this ServiceAccount via `kubectl create serviceaccount`.
# Only use this file if you prefer to manage the SA as YAML; then uncomment it in
# kustomization.yaml. The association itself is still an EKS API call.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentcore-harness-agent-sa
  namespace: agents
