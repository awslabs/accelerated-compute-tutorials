site_name: AI Infra on AWS Guide
site_url: https://awslabs.github.io/accelerated-compute-tutorials/
site_author: AWS
site_description: Practical tutorials for running large-scale AI/ML workloads on AWS accelerated computing

# Repository
repo_name: awslabs/accelerated-compute-tutorials
repo_url: https://github.com/awslabs/accelerated-compute-tutorials
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2024–2026 Amazon Web Services, Inc.

# Files under docs/ that are source material, not pages. Excluding them keeps
# them out of the build, the sitemap and search. Patterns are gitignore-style
# and match at any depth, so they apply to every locale folder.
exclude_docs: |
  # internal notes and templates
  _*.md
  # lab container sources — only referenced from a Dockerfile COPY line
  trading-agent/

# Configuration
theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

# Plugins
plugins:
  - search:
      lang:
        - ko
        - en
  - i18n:
      docs_structure: folder
      languages:
        - locale: ko
          name: 한국어
          build: true
          nav_translations:
            Start Here: 시작하기
            What's New: 최신소식
            P6-B300 Seoul Launch: P6-B300 서울 리전 출시
            Inference: 추론
            Accelerator Selection Guide: 가속기 선택 가이드
            AI Infra Design: AI 인프라 설계
            AI Infra Setup: AI 인프라 구축/환경구성
            AI Infra Operations: AI 인프라 운영
            AI Infra Application: AI 인프라 Application
            AI Infra Deep Dive: AI 인프라 Deep Dive
            Purchase Options: 구매 옵션
            Infra Decision Guide: 인프라 의사결정 가이드
            Region Selection Guide: 리전 선택 고려사항
            Networking: 네트워킹
            Storage: 스토리지
            Optimization Guide: 최적화 가이드
            Benchmark & PoC Methodology: 벤치마크 & PoC 방법론
            DLAMI Host Setup & Validation: DLAMI 호스트 구성·검증
            Slurm + Pyxis + Enroot: Slurm + Pyxis + Enroot
            Container Image (NGC + EFA): 컨테이너 이미지 (NGC + EFA)
            GDS (GPUDirect Storage): GDS (GPUDirect Storage)
            MoE / Hybrid-EP: MoE / Hybrid-EP 검증
            Megatron Bridge on KubeRay: KubeRay 기반 Megatron Bridge 파인튜닝
            EFA (Elastic Fabric Adapter): EFA (Elastic Fabric Adapter)
            Reference Architectures: 실전 아키텍처
            Slurm-based GPU Training Cluster: Slurm 기반 GPU 학습 클러스터
            Training & Events: 교육 및 행사
            Training Programs: 교육
            Events: 행사
            Past Events: 지난 행사
            Preparation: 사전 준비
            Monitoring & Scaling: 모니터링 & 스케일링
            Learning: 학습하기
            Learning Path: 학습경로
            Capacity Monitoring: Capacity 모니터링
            NVIDIA GPU Instances: NVIDIA GPU 인스턴스
            Case Studies: 고객 사례
            Model Onboarding: 모델 온보딩
            Profiling: 프로파일링
            # Kept in English on purpose (product, model, and solution-motion names).
            # Listed explicitly so every nav entry has a Korean label on record.
            AI Infra: AI Infra
            AWS Trainium: AWS Trainium
            NVIDIA GPU: NVIDIA GPU
            Docker/DLC: Docker/DLC
            Capacity Blocks: Capacity Blocks
            NDD Day 1 Hands-on Lab: NDD Day 1 Hands-on Lab
            NDD Day 2 Hands-on Lab: NDD Day 2 Hands-on Lab
            vLLM on Neuron: vLLM on Neuron
            vLLM + NxDI (Classic): vLLM + NxDI (Classic)
            Llama 3.1 70B: Llama 3.1 70B
            Qwen2.5 72B: Qwen2.5 72B
            Qwen3 32B: Qwen3 32B
            Qwen3 8B: Qwen3 8B
            Qwen3 Coder 480B: Qwen3 Coder 480B
            Llama 3.1 8B (trn1): Llama 3.1 8B (trn1)
            TGI on Neuron: TGI on Neuron
            Neuron Explorer: Neuron Explorer
            NKI Kernels: NKI Kernels
            Frugal AI: Frugal AI
            Domain Intelligence: Domain Intelligence
            Hybrid & Sovereign AI: Hybrid & Sovereign AI
            Open Agents: Open Agents
            OpenClaw on EKS: OpenClaw on EKS
            Crypto Trading Agent: Crypto Trading Agent
            Agents on EKS with AgentCore Primitives: Agents on EKS with AgentCore Primitives
            Claude Managed Agents on EKS: Claude Managed Agents on EKS
            Disaggregated Inference (Dynamo): Disaggregated Inference (Dynamo)
            KV-Aware Routing (Dynamo): KV-Aware Routing (Dynamo)
            Ray + EFA on EKS: Ray + EFA on EKS
            Distributed Training: Distributed Training
            PyTorch Native: PyTorch Native
            GPU Operator (Private EKS): GPU Operator (Private EKS)
            Neuron Foundations (NFD): Neuron Foundations (NFD)
            Neuron Deep Dive (NDD): Neuron Deep Dive (NDD)
        - locale: en
          default: true
          name: English
          build: true
  - tags

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation — single source of truth for BOTH locales.
# Labels here are English; Korean labels live in languages[ko].nav_translations.
# The structure is shared, so the two locales can never drift apart.
