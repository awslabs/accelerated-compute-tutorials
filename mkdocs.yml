site_name: AI Infra on AWS Guide
site_url: https://awslabs.github.io/accelerated-compute-tutorials/
site_author: AWS
site_description: Practical tutorials for running large-scale AI/ML workloads on AWS accelerated computing

# Repository
repo_name: awslabs/accelerated-compute-tutorials
repo_url: https://github.com/awslabs/accelerated-compute-tutorials
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2024–2026 Amazon Web Services, Inc.

# Files under docs/ that are source material, not pages. Excluding them keeps
# them out of the build, the sitemap and search. Patterns are gitignore-style
# and match at any depth, so they apply to every locale folder.
exclude_docs: |
  # internal notes and templates
  _*.md
  # lab container sources — only referenced from a Dockerfile COPY line
  trading-agent/

# Configuration
theme:
  name: material
  custom_dir: overrides
  language: ko
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

# Plugins
plugins:
  - search:
      lang:
        - ko
        - en
  - i18n:
      docs_structure: folder
      languages:
        - locale: ko
          default: true
          name: 한국어
          build: true
          nav_translations:
            Start Here: 시작하기
            What's New: 최신소식
            Inference: 추론
            Accelerator Selection Guide: 가속기 선택 가이드
            AI Infra Design: AI 인프라 설계
            AI Infra Setup: AI 인프라 구축/환경구성
            AI Infra Operations: AI 인프라 운영
            AI Infra Application: AI 인프라 Application
            AI Infra Deep Dive: AI 인프라 Deep Dive
            Purchase Options: 구매 옵션
            Infra Decision Guide: 인프라 의사결정 가이드
            Region Selection Guide: 리전 선택 고려사항
            Networking: 네트워킹
            Storage: 스토리지
            Optimization Guide: 최적화 가이드
            Benchmark & PoC Methodology: 벤치마크 & PoC 방법론
            Training & Events: 교육 및 행사
            Training Programs: 교육
            Events: 행사
            Past Events: 지난 행사
            Preparation: 사전 준비
            Monitoring & Scaling: 모니터링 & 스케일링
            Learning: 학습하기
            Learning Path: 학습경로
            Capacity Monitoring: Capacity 모니터링
            NVIDIA GPU Instances: NVIDIA GPU 인스턴스
            Case Studies: 고객 사례
            Model Onboarding: 모델 온보딩
            Profiling: 프로파일링
        - locale: en
          name: English
          build: true
  - tags

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation — single source of truth for BOTH locales.
# Labels here are English; Korean labels live in languages[ko].nav_translations.
# The structure is shared, so the two locales can never drift apart.
# When adding a page: add it here, and add a Korean label if it needs translating.
nav:
  - Start Here:
      - index.md
  - AI Infra:
      - ai-infra/index.md
      - AI Infra Design:
          - ai-infra/decisions/index.md
          - Infra Decision Guide: ai-infra/infra-decision-guide.md
          - Accelerator Selection Guide: ai-infra/gpu-selection-guide.md
          - Region Selection Guide: ai-infra/self-hosted-llm-considerations.md
      - AI Infra Setup:
          - ai-infra/environment/index.md
          - Docker/DLC: ai-infra/docker-dlc.md
          - Networking: ai-infra/efa-networking.md
          - Storage: ai-infra/storage.md
      - AI Infra Operations:
          - ai-infra/operations/index.md
          - Monitoring & Scaling: ai-infra/operations/monitoring-scaling.md
          - Capacity Monitoring: ai-infra/operations/cb-monitoring-system.md
      - AI Infra Application:
          - ai-infra/application/index.md
      - AI Infra Deep Dive:
          - ai-infra/deep-dive/index.md
          - Storage: ai-infra/deep-dive/storage.md
          - Networking: ai-infra/deep-dive/networking.md
          - Optimization Guide: ai-infra/optimization-guide.md
          - Benchmark & PoC Methodology: ai-infra/benchmark-poc.md
      - NVIDIA GPU:
          - nvidia-gpu/index.md
          - NVIDIA GPU Instances: nvidia-gpu/instance-guide.md
      - Purchase Options:
          - ai-infra/purchase-options/index.md
          - Capacity Blocks: ai-infra/capacity-blocks-guide.md
  - Trainium:
      - aws-ai-chip/index.md
      - Learning:
          - aws-ai-chip/education/index.md
          - Learning Path: aws-ai-chip/education/learning-path.md
          - NDD Day 1 Hands-on Lab: aws-ai-chip/education/ndd-day1-hands-on-lab.md
          - NDD Day 2 Hands-on Lab: aws-ai-chip/education/ndd-day2-hands-on-lab.md
      - Inference:
          - aws-ai-chip/inference/index.md
          - vLLM on Neuron:
              - aws-ai-chip/inference/vllm/index.md
              - Model Onboarding: aws-ai-chip/inference/vllm/model-onboarding.md
          - vLLM + NxDI (Classic):
              - aws-ai-chip/inference/vllm-nxdi-classic/index.md
              - Llama 3.1 70B: aws-ai-chip/inference/vllm-nxdi-classic/llama3.1-70b.md
              - Qwen2.5 72B: aws-ai-chip/inference/vllm-nxdi-classic/qwen2.5-72b.md
              - Qwen3 32B: aws-ai-chip/inference/vllm-nxdi-classic/qwen3-32b.md
              - Qwen3 8B: aws-ai-chip/inference/vllm-nxdi-classic/qwen3-8b.md
              - Qwen3 Coder 480B: aws-ai-chip/inference/vllm-nxdi-classic/qwen3-coder-480b.md
          - vLLM on Neuron (Standalone): aws-ai-chip/inference/vllm-on-neuron.md
          - TGI on Neuron: aws-ai-chip/inference/tgi-on-neuron.md
      - Case Studies: aws-ai-chip/case-studies/index.md
      - Profiling:
          - aws-ai-chip/profiling/index.md
          - Neuron Explorer: aws-ai-chip/profiling/neuron-explorer.md
          - NKI Kernels: aws-ai-chip/profiling/nki-kernels.md
  - Frugal AI & Domain Intelligence:
      - frugal-ai/index.md
  - Hybrid & Sovereign AI:
      - hybrid-sovereign-ai/index.md
  - Self-Managed Agents:
      - self-managed-agents/index.md
      - OpenClaw on EKS: self-managed-agents/openclaw-eks-lab-guide/index.md
      - Crypto Trading Agent: self-managed-agents/crypto-trading-agent/index.md
      - Disaggregated Inference (Dynamo): self-managed-agents/dynamo-disaggregated/index.md
      - Ray + EFA on EKS: self-managed-agents/ray-on-eks-efa/index.md
      - Distributed Training: self-managed-agents/distributed-training.md
      - PyTorch Native: self-managed-agents/pytorch-native.md
      - GPU Operator (Private EKS): self-managed-agents/private-eks-gpu-operator/index.md
  - Training & Events:
      - events/index.md
      - Training Programs:
          - events/education/index.md
          - Neuron Foundations (NFD): events/education/neuron-foundations/index.md
          - Neuron Deep Dive (NDD):
              - events/education/neuron-deep-dive/index.md
              - Preparation: events/education/neuron-deep-dive/preparation.md
      - Events: events/upcoming/index.md
      - Past Events: events/past/index.md
  - What's New:
      - updates/index.md

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/awslabs/accelerated-compute-tutorials
  generator: false
  analytics:
    provider: google
    property: G-XXXXXXXXXX

extra_css:
  - stylesheets/extra.css


