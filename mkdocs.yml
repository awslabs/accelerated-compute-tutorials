site_name: AI Infra on AWS Guide
site_url: https://awslabs.github.io/accelerated-compute-tutorials/
site_author: AWS
site_description: >-
  AWS 가속 컴퓨팅 인프라에서 대규모 AI/ML 워크로드를 실행하기 위한
  실전 튜토리얼 모음

# Repository
repo_name: awslabs/accelerated-compute-tutorials
repo_url: https://github.com/awslabs/accelerated-compute-tutorials
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2024–2026 Amazon Web Services, Inc.

# Configuration
theme:
  name: material
  custom_dir: overrides
  language: ko
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

# Plugins
plugins:
  - search:
      lang:
        - ko
        - en
  - i18n:
      docs_structure: folder
      languages:
        - locale: ko
          default: true
          name: 한국어
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            개요: Overview
            시작하기: Getting Started
            AWS Trainium: AWS Trainium
            NVIDIA GPU: NVIDIA GPU
            AI Infra: AI Infra
            최신소식: What's New
            AI Infra 레시피: AI Infra Recipes
            추론: Inference
            학습: Training
            NKI Kernel: NKI Kernel
            프로파일링: Profiling
            고급 설정: Advanced
            영상 콘텐츠: Video Content
            교육: Education
            GPU 선택 가이드: GPU Selection Guide
            가속기 선택 가이드: Accelerator Selection Guide
            AI 인프라 설계: AI Infra Design
            가속기 구매 옵션: Accelerator Purchase Options
            최적화 가이드: Optimization Guide
            벤치마크 & PoC 방법론: Benchmark & PoC Methodology
            PoC 사례: PoC Case Studies
            교육 및 행사: Training & Events
            행사: Events
            지난 행사: Past Events
            사전 준비: Preparation
            교육: Training
            모니터링 & 스케일링: Monitoring & Scaling
            AI 인프라 운영: AI Infra Operations
            학습하기: Learning
            학습경로: Learning Path
            Capacity 모니터링: Capacity Monitoring
            NVIDIA GPU 인스턴스: NVIDIA GPU Instances
  - tags

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation — 콘텐츠 준비된 페이지만 노출
# 새 페이지 추가 시 해당 섹션에 경로 추가
nav:
  - 개요:
      - index.md
  - AI Infra:
      - ai-infra/index.md
      - AI 인프라 설계:
          - ai-infra/decisions/index.md
          - 인프라 의사결정 가이드: ai-infra/infra-decision-guide.md
          - 가속기 선택 가이드: ai-infra/gpu-selection-guide.md
          - 리전 선택 고려사항: ai-infra/self-hosted-llm-considerations.md
          - 용량: ai-infra/capacity-planning.md
      - AI 인프라 구축/환경구성:
          - ai-infra/environment/index.md
          - Docker/DLC: ai-infra/docker-dlc.md
          - 네트워킹: ai-infra/efa-networking.md
          - 스토리지: ai-infra/storage.md
      - AI 인프라 운영:
          - ai-infra/operations/index.md
          - 모니터링 & 스케일링: ai-infra/operations/monitoring-scaling.md
          - Capacity 모니터링: ai-infra/operations/cb-monitoring-system.md
      - AI 인프라 Application:
          - ai-infra/application/index.md
      - AI 인프라 Deep Dive:
          - ai-infra/deep-dive/index.md
          - 스토리지: ai-infra/deep-dive/storage.md
          - 네트워킹: ai-infra/deep-dive/networking.md
          - 최적화 가이드: ai-infra/optimization-guide.md
          - 벤치마크 & PoC 방법론: ai-infra/benchmark-poc.md
      - 구매 옵션:
          - ai-infra/purchase-options/index.md
          - Capacity Blocks: ai-infra/capacity-blocks-guide.md
  - AWS Trainium:
      - aws-ai-chip/index.md
      - 학습하기:
          - aws-ai-chip/education/index.md
          - 학습경로: aws-ai-chip/education/learning-path.md
          - NDD Day 1 Hands-on Lab: aws-ai-chip/education/ndd-day1-hands-on-lab.md
          - NDD Day 2 Hands-on Lab: aws-ai-chip/education/ndd-day2-hands-on-lab.md
      - 추론:
          - aws-ai-chip/inference/index.md
          - vLLM on Neuron:
              - aws-ai-chip/inference/vllm/index.md
              - 모델 온보딩: aws-ai-chip/inference/vllm/model-onboarding.md
          - vLLM + NxDI (Classic):
              - aws-ai-chip/inference/vllm-nxdi-classic/index.md
              - Llama 3.1 70B: aws-ai-chip/inference/vllm-nxdi-classic/llama3.1-70b.md
              - Qwen2.5 72B: aws-ai-chip/inference/vllm-nxdi-classic/qwen2.5-72b.md
              - Qwen3 32B: aws-ai-chip/inference/vllm-nxdi-classic/qwen3-32b.md
              - Qwen3 8B: aws-ai-chip/inference/vllm-nxdi-classic/qwen3-8b.md
              - Qwen3 Coder 480B: aws-ai-chip/inference/vllm-nxdi-classic/qwen3-coder-480b.md
      - 고객 사례: aws-ai-chip/case-studies/index.md
  - NVIDIA GPU:
      - nvidia-gpu/index.md
      - NVIDIA GPU 인스턴스: nvidia-gpu/instance-guide.md
  - AI Infra 레시피:
      - recipes/index.md
  - 교육 및 행사:
      - events/index.md
      - 교육:
          - events/education/index.md
          - Neuron Foundations (NFD): events/education/neuron-foundations/index.md
          - Neuron Deep Dive (NDD):
              - events/education/neuron-deep-dive/index.md
              - 사전 준비: events/education/neuron-deep-dive/preparation.md
      - 행사: events/upcoming/index.md
      - 지난 행사: events/past/index.md
  - 최신소식:
      - updates/index.md

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/awslabs/accelerated-compute-tutorials
  generator: false
  analytics:
    provider: google
    property: G-XXXXXXXXXX

extra_css:
  - stylesheets/extra.css


